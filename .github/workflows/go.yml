name: Build

on:
  push:
    branches: [main, modernize-runtime, vhive-compatible, cri-native-snapshot-restore, damon-virtio-pmem]
  pull_request:
    branches: [main, modernize-runtime, vhive-compatible, cri-native-snapshot-restore, damon-virtio-pmem]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.11'
      - name: Unit tests and real release API
        run: FC_TEST_RELEASE_API=1 make unit-tests EXTRAGOARGS=-v
      - name: Generated client is reproducible
        run: |
          make generate
          git diff --exit-code
